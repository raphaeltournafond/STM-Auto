; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:bluepill_f103c8]
platform = ststm32
board = bluepill_f103c8
framework = arduino

upload_protocol = stlink

monitor_speed = 115200

; Remap debug Serial to USART2 (PA2/PA3); USART1 (PA9/PA10) is reserved for the MP3 module.
build_flags =
    -D PIN_SERIAL_TX=PA2
    -D PIN_SERIAL_RX=PA3
    -D SERIAL_UART_INSTANCE=2

lib_deps =
    adafruit/Adafruit SSD1306 @ ^2.5.7
    adafruit/Adafruit GFX Library @ ^1.11.5

; Host-native env for unit-testing the pure decision logic (lib/decision).
; Excludes src/ (Arduino) so only the library + tests build. Run: pio test -e native
[env:native]
platform = native
test_framework = unity
build_src_filter = -<*>
